# Shimla Rising -- Python lint config
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLW"]
ignore = [
  "E501",    # line length ruff formatter dekhta hai
  "B905",    # zip(strict=) -- yahan zaroori nahi
]

[lint.per-file-ignores]
# Blender scripts Blender ke bundled Python pe chalte hain, yahan nahi.
# `bpy`/`bmesh`/`mathutils` sirf wahin milte hain.
"tools/blender/*" = ["E402", "F401", "ARG001"]
"tools/blender/lib/*" = ["E402", "F401"]
# Pipeline modules geo import se pehle sys.path set karte hain -- ye jaanboojh kar hai.
"tools/shimla_pipeline/*" = ["E402"]
"tools/terrain/*" = ["E402"]
"tools/tests/*" = ["E402", "PLW1510"]
